/* --- WSPÓLNE --- */
.User {

}

#emoji {
    display: none;
    background-color: grey;
    border-radius: 10px;
    flex-wrap: wrap;
    gap: 10px;

    margin: 20px auto;
    justify-content: center;
    padding: 10px;
}

#emoji span {
    width: calc(25% - 10px); /* 4 elementy w rzędzie */
    text-align: center;
}

#emoji:hover p {
    cursor: pointer;
}
#emojipanel:hover {
    cursor: pointer;
}

#keybordUI {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
    padding: 5px;
    border: grey 15px solid;
    background-color: grey;
    border-radius: 10px;
}

.keyinput {
    text-align: center;
    border: #000000 2px solid;
    background-color: #000000;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 5px;
}

.keyinput:hover {
    cursor: pointer;
}

.AI {
    text-align: left;
}

a {
    color: blue;
    text-decoration: none;
}


.panel {
     display: flex;
     margin: 2px;
     letter-spacing: 10px;
}
/* Media Query dla bardzo małych ekranów (np. telefony pionowo) */
@media (max-width: 400px) {
    .main {
        padding: 20px; /* Zmniejszony padding, żeby było więcej miejsca na tekst */
    }
    
}

@media (max-width: 768px) {
    /* CHAT wyżej */
    .main {
        margin-bottom: 220px; /* robi miejsce na panel ustawień */
    }

    /* USTAWIENIA na dole jako osobny panel */
    #ustawienia {
        display: flex;
        flex-direction: column;
        position: fixed;

        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);

        width: 90%;
        max-width: 320px;

        padding: 15px;
        border-radius: 15px;
        z-index: 999;

        text-align: center;
        letter-spacing: normal;

        /* ODSTĘP WIZUALNY */
        box-shadow: 0 0 20px rgba(0,0,0,0.4);

        /* lekka przezroczystość */
        backdrop-filter: blur(8px);
    }
}
}
.hidden {
    display: none !important;
}
